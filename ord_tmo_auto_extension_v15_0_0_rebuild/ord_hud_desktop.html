<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="ord-helper" content="v25.1.0-desktop-hud"><title>ORD HUD</title><link rel="stylesheet" href="ord_app.css"><link rel="stylesheet" href="ord_ui_v20.css"><style>
/* 인게임 HUD — 창이 아니라 게임 위에 뜬 글자·칩처럼 보여야 한다.
   배경은 완전 투명, 콘텐츠 블록만 반투명 판.  클릭은 전부 게임으로
   통과하므로(메인 프로세스 setIgnoreMouseEvents) 상호작용 없음.

   v22.7(사용자: "f8 f9 기능이 너무 별로야 정보가 중구난방으로 정리되어
   있고 글씨도 작아"): 두 가지 근본 수정 —
   ① 이 페이지는 v20.1 리스킨 이후에도 은퇴한 구형 cockpit 시트를
      로드하고 있었다.  중계 조각(.v153-hud/.v151-action)의 스타일은
      전부 ord_ui_v20.css 에 있으므로 지금까지 HUD 는 맨몸 HTML 로
      그려졌다 — "중구난방"의 정체.  본창과 같은 신작 시트를 싣고,
      루트에 v153-screen 클래스를 달아 디자인 토큰(var(--…))을 살린다.
   ② HUD 전용 재배치·확대 — 표시 순서를 고정(라운드 → 국면 → 마감 →
      선위·리롤 → 지금 할 일 카드)하고 글씨를 게임 위에서 읽히는
      크기(제목 22px·본문 14.5px)로 키운다.  카드의 보조 블록(그다음
      후보·스토리 스텝퍼·넘어간 추천·리롤 칩)은 클릭 통과 화면에서
      정보가 아니라 소음이라 숨긴다. */
html,body{background:transparent !important;margin:0;padding:0;overflow:hidden;}
#ord-hud-root{display:flex;flex-direction:column;gap:8px;padding:8px;font-size:15px;pointer-events:none;}
#ord-hud-root>*{background:rgba(10,8,12,.92) !important;border:1px solid rgba(224,92,126,.3);border-radius:12px;padding:10px 12px !important;box-shadow:0 6px 22px rgba(0,0,0,.5);}
/* ── 상단 스트립: 순서 고정 — 라운드(0) → 국면(1) → 마감(2) → 필(3) ── */
#ord-hud-root .v153-hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
#ord-hud-root .v153-round{order:0;}
#ord-hud-root .v22-phase{order:1;font-size:14px;}
#ord-hud-root .v22-due{order:2;font-size:14px;font-weight:700;}
#ord-hud-root .v153-pill{order:3;font-size:13px;}
#ord-hud-root .v153-round strong{font-size:22px;min-width:0;}
#ord-hud-root .v153-pill b{font-size:17px;}
/* 시계 라벨·계통 스위치는 HUD 에서 정보가 아니다. */
#ord-hud-root [data-clock],#ord-hud-root .v153-mode{display:none !important;}
/* ── 지금 할 일 카드: 제목·이유 확대, 보조 블록 정리 ── */
#ord-hud-root .v151-action{overflow:visible;}
#ord-hud-root .v151-action-title,#ord-hud-root .v151-action-main b{font-size:22px;line-height:1.25;}
#ord-hud-root .v151-action-main p{font-size:14.5px;color:var(--sub,#c4bccb);}
#ord-hud-root .v151-action-main>img,#ord-hud-root .v151-action-main>i{width:54px;height:54px;}
#ord-hud-root .v151-cost b{font-size:20px;}
#ord-hud-root .v153-next-candidates,#ord-hud-root .v221-story,#ord-hud-root .v222-vetoed,#ord-hud-root .v151-action-facts,#ord-hud-root .v151-continue{display:none !important;}
/* 클릭이 통과되는 화면에서 기능 없는 버튼은 노이즈 — 전부 숨긴다.
   회복 목표 줄(v151-recovery-row)만 정보라서 평면 표시로 유지.
   v25.1 주의: 이 규칙에 :not(.v25-row)를 추가하면 특이성이 (1,2,1)로
   올라 v216 동결 경고의 '게임 결과' 버튼 예외(아래, 1,1,1)까지 이겨
   버린다 — 규칙은 그대로 두고, 보드 행은 아래에서 동특이성(1,1,1)
   후순위 !important 로 되살린다. */
#ord-hud-root button:not(.v151-recovery-row){display:none !important;}
#ord-hud-root button{pointer-events:none;}
/* 예외: 관전 동결 경고의 "게임 결과" 버튼은 문장 일부다 — 숨기면
   "…라면 를 기록하세요"로 깨진다.  평문으로 눕혀 문장을 지킨다. */
#ord-hud-root .v216-freeze-note button{display:inline !important;border:0;padding:0;background:transparent !important;color:inherit;font:inherit;font-weight:700;}
#ord-hud-root .v151-phase,#ord-hud-root .v151-action-foot,#ord-hud-root .v151-inline-actions{display:none !important;}
/* v23.7(사용자: "이거 화면을 너무 가린다 이것만 보고 하기에도 힘들고"):
   내용 다이어트.  잠금·대기 카드의 안내 문단("TMO.GG 데스크톱 프로그램이
   응답하고 있습니다…")은 게임 위에서 소음이다 — 상태 제목 한 줄 +
   결손 한 줄 + 마지막 유효 추천(고스트)만 남긴다.  전체 여백·글자도
   화면 점유 대비 정보 밀도가 맞게 한 단계 줄인다(가독 하한은 v22.7
   사용자 불만 기준으로 지킨다: 제목 18px·본문 13px 아래로는 안 간다). */
#ord-hud-root{padding:6px;gap:6px;font-size:14px;}
#ord-hud-root>*{padding:8px 10px !important;border-radius:10px;}
#ord-hud-root .v151-action-title,#ord-hud-root .v151-action-main b{font-size:18px;}
#ord-hud-root .v151-action-main p{font-size:13px;}
#ord-hud-root .v151-action-main>img,#ord-hud-root .v151-action-main>i{width:42px;height:42px;}
#ord-hud-root .v151-cost b{font-size:17px;}
#ord-hud-root .v153-round strong{font-size:19px;}
#ord-hud-root .v153-pill b{font-size:15px;}
#ord-hud-root .v151-action.blocked .v151-action-copy p,#ord-hud-root .v151-action.blocked .v151-action-copy i{display:none !important;}
#ord-hud-root .v151-action.blocked .v151-action-copy b{font-size:14px;font-weight:700;}
#ord-hud-root .v151-action.blocked .v151-state{font-size:11px;}
#ord-hud-root .v158-blocked-spec{font-size:12px;}
#ord-hud-root .v158-blocked-spec small{font-size:10.5px;}
#ord-hud-root .v158-blocked-spec span{display:inline-flex;gap:4px;margin-right:8px;}
#ord-hud-root .v23-ghost-card{font-size:12.5px;}
/* v23.9(사용자: "클릭은 되는데 가려서 안 보이니까 클릭이 힘들어"):
   승인 버튼(제작함·리롤함 등 primary)은 HUD에서 직접 누른다 — 버튼 위에
   커서가 온 동안만 창이 클릭을 받고 나머지는 전부 게임으로 통과한다.
   클릭은 메인 창의 같은 버튼으로 중계(ord_hud_desktop.js). */
#ord-hud-root .v151-action-foot:has(button.primary[data-act]),#ord-hud-root .v151-inline-actions:has(button.primary[data-act]){display:flex !important;gap:6px;align-items:center;margin-top:7px;}
#ord-hud-root .v151-action-foot small{font-size:10.5px;opacity:.65;}
#ord-hud-root .v151-action button.primary[data-act]{display:inline-flex !important;pointer-events:auto;align-items:center;justify-content:center;padding:7px 12px;font-size:13px;font-weight:800;cursor:pointer;}
#ord-hud-root .v151-action-foot button:not(.primary){display:none !important;}
/* v23.11: 카드의 '자세히' 접힘은 HUD에서 통째로 소음 — 숨긴다. */
#ord-hud-root .v2311-more{display:none !important;}
/* v25.1.0: 결정 카드가 없을 때 HUD 는 갈 수 있는 유닛 보드를 받는다.
   v25.1(적대 검증): 창은 560px 고정·스크롤 불가라 초상 행이 커진 만큼
   다이어트를 조인다 — 그룹당 3행, 연성 경합 줄은 숨기고 ⚠(침범·잠식)
   경고만 유지.  행 표시는 위 전역 버튼 숨김(1,1,1)을 동특이성 후순위
   !important 로 이긴다(v25.0.x 는 이 규칙에 먹혀 행이 아예 안 그려졌다). */
#ord-hud-root .v25-board{border:0;padding:10px 12px;}
#ord-hud-root .v25-board-head b{font-size:18px;}
#ord-hud-root .v25-board-head small{font-size:12px;}
#ord-hud-root button.v25-row{display:grid !important;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:2px 8px;width:100%;text-align:left;border:1px solid rgba(122,140,170,.35);border-radius:8px;padding:4px 8px 4px 4px;margin-bottom:3px;background:transparent;color:inherit;font:inherit;font-size:14px;}
#ord-hud-root .v25-row .v25-face{width:34px;height:34px;border-radius:7px;object-fit:cover;border:1px solid rgba(122,140,170,.4);}
#ord-hud-root .v25-row i.v25-ph{display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:15px;}
#ord-hud-root .v25-group>.v25-row:nth-of-type(n+4){display:none !important;}
#ord-hud-root .v25-group>small{display:block;margin:4px 0 2px;font-size:11.5px;opacity:.8;}
#ord-hud-root .v25-row>small{grid-column:3;grid-row:1;justify-self:end;white-space:nowrap;font-size:12px;}
#ord-hud-root .v25-warns{grid-column:2/span 2;grid-row:2;display:flex;flex-wrap:wrap;gap:3px 7px;}
#ord-hud-root .v25-clash{display:none;font-style:normal;font-size:11px;color:#FFC58A;}
#ord-hud-root .v25-clash.hard{display:inline;color:#FFAD93;font-weight:700;}
#ord-hud-root .v25-pressure{display:flex;flex-wrap:wrap;gap:3px 7px;border:1px solid rgba(255,159,67,.4);border-radius:8px;padding:5px 8px;margin-bottom:6px;font-size:12px;}
#ord-hud-root .v25-pressure small{flex:1 1 100%;color:#FFC58A;font-weight:800;}
#ord-hud-root .v25-pressure em{font-style:normal;}
body.hud-hot #ord-hud-root .v151-action button.primary[data-act]{outline:2px solid rgba(255,214,120,.75);}
/* v25.1.0(사용자: "오버레이 창이 반투명해도 ㄱㅊ을듯?"): 콘텐츠 판을
   반투명(.62)으로 낮춰 뒤의 게임이 비쳐 보이게 한다.  가독은 글자
   그림자로 지키고, 승인 버튼 호버(클릭 가능 순간)에는 판이 다시
   진해져(.92) 조작 대비를 확보한다. */
#ord-hud-root>*{background:rgba(10,8,12,.62) !important;}
#ord-hud-root{text-shadow:0 1px 3px rgba(0,0,0,.85);}
body.hud-hot #ord-hud-root>*{background:rgba(10,8,12,.92) !important;}
</style></head><body><div id="ord-hud-root" class="v153-screen"></div><script src="ord_hud_desktop.js"></script></body></html>
